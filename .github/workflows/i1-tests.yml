# Suíte de contrato e testes do I1 a cada envio ao repositório (T15 / plano de verificação de B4).
# Nenhum job publica no Kafka: ODS_KAFKA_BROKER não é definido aqui, e o modo kafka falha sem ele.
name: i1-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Contrato ods.i1.detections (schema, exemplos, mock, publicador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contract.txt
      - run: pip install -r requirements-contract.txt
      - name: Suíte de contrato
        run: python I1/tests/test_contract_schema.py
      - name: Produtor falso emite mensagens válidas
        run: python I1/mock_producer.py --frames 12 --fps 0

  pipeline:
    name: Pipeline completo (sessão, erros e Degrau A com o ONNX real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: torch de CPU
        run: pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Todas as suítes
        run: python -m unittest discover -s I1/tests -p "test_*.py" -v
